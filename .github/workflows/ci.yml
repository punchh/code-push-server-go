# Self-contained Go CI (does not call punchh/GHA-central-workflow — that reusable
# workflow must be allowed by org settings; use this file if you see "workflow was not found".)

name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Configure private Go modules (punchh)
        env:
          TOKEN: ${{ secrets.SVC_ACCOUNT_GITHUB_ORG_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/punchh/".insteadOf "https://github.com/punchh/"
          fi

      - name: Go mod download
        env:
          GOPRIVATE: github.com/punchh
          GONOSUMDB: github.com/punchh
        run: go mod download

      - name: Build
        env:
          GOPRIVATE: github.com/punchh
        run: go build -v ./...

      - name: Test
        env:
          GOPRIVATE: github.com/punchh
        run: go test -v ./...
