# Self-contained Go CI (does not call punchh/GHA-central-workflow — that reusable
# workflow must be allowed by org settings; use this file if you see "workflow was not found".)

name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Go uses git for GOPRIVATE modules; netrc + url.insteadOf avoids
      # "could not read Username for 'https://github.com': terminal prompts disabled".
      # Prefer org PAT (works for fork PRs if you expose a dedicated secret — usually you still
      # need a branch on the upstream repo). If unset, fall back to GITHUB_TOKEN (same-repo
      # workflows only; org must allow Actions to read private repos — see GitHub docs).
      - name: Authenticate for private github.com/punchh modules
        env:
          PAT: ${{ secrets.SVC_ACCOUNT_GITHUB_ORG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${PAT}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${GITHUB_TOKEN}"
            echo "SVC_ACCOUNT_GITHUB_ORG_TOKEN not set — using GITHUB_TOKEN for git HTTPS."
            echo "If go mod download fails with 403, add SVC_ACCOUNT_GITHUB_ORG_TOKEN or open the PR from a branch on this repo (not a fork)."
          fi
          {
            echo "machine github.com"
            echo "login x-access-token"
            echo "password ${TOKEN}"
          } >> "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git config --global url."https://x-access-token:${TOKEN}@github.com/punchh/".insteadOf "https://github.com/punchh/"

      - name: Go mod download
        env:
          GOPRIVATE: github.com/punchh
          GONOSUMDB: github.com/punchh
          GOPROXY: direct
        run: go mod download

      - name: Build
        env:
          GOPRIVATE: github.com/punchh
          GOPROXY: direct
        run: go build -v ./...

      - name: Test
        env:
          GOPRIVATE: github.com/punchh
          GOPROXY: direct
        run: go test -v ./...
