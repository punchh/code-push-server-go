# Self-contained Go CI (does not call punchh/GHA-central-workflow — that reusable
# workflow must be allowed by org settings; use this file if you see "workflow was not found".)

name: Go CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Private module github.com/punchh/go-packages must use a PAT: GITHUB_TOKEN only has
      # access to *this* repo, so GitHub returns misleading "repository not found" for other private repos.
      # Fork PRs: org secrets are not available — push a branch on punchh/code-push-server-go.
      - name: Authenticate for private github.com/punchh modules
        env:
          TOKEN: ${{ secrets.SVC_ACCOUNT_GITHUB_ORG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SVC_ACCOUNT_GITHUB_ORG_TOKEN is required to clone github.com/punchh/go-packages."
            echo "GITHUB_TOKEN cannot read sibling private repos (GitHub reports that as 'repository not found')."
            echo "Add an org or repo Actions secret: classic PAT with repo scope, or fine-grained PAT with read on punchh/go-packages."
            echo "Fork PRs do not receive org secrets — open the PR from a branch on this repository."
            exit 1
          fi
          {
            echo "machine github.com"
            echo "login x-access-token"
            echo "password ${TOKEN}"
          } >> "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git config --global url."https://x-access-token:${TOKEN}@github.com/punchh/".insteadOf "https://github.com/punchh/"

      # Do not set GOPROXY=direct: it forces every module through git; some public tags
      # (e.g. chenzhuoyu/iasm) can fail with "unknown revision" on GitHub while proxy.golang.org still serves them.
      # GOPRIVATE already makes only github.com/punchh/* bypass the proxy.
      - name: Go mod download
        env:
          GOPRIVATE: github.com/punchh
          GONOSUMDB: github.com/punchh
        run: go mod download

      - name: Build
        env:
          GOPRIVATE: github.com/punchh
        run: go build -v ./...

      - name: Test
        env:
          GOPRIVATE: github.com/punchh
        run: go test -v ./...
